<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴学小盒子 · 荒漠教室白模（规范示例 v1.0）</title>
<!--
  ============================================================
  本文件是《白膜 HTML 规范 v1.0》的参考实现。
  场景：荒漠教室一镜到底 15s —— 推进 / 药盒滑入 / 两次 360° / 产品特写。
  AI 生成新场景时，整体结构照抄本文件，只换 TODO 部分。
  ============================================================
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: #0a0a0a; overflow: hidden; user-select: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #app { display: flex; width: 100vw; height: 100vh; }
  #stageWrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 16px; min-width: 0; min-height: 0; background: #0a0a0a; }
  #stage {
    aspect-ratio: 16 / 9; width: 100%; max-width: 100%; max-height: 100%;
    background: #000; position: relative; overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.9);
  }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; }
  #panel {
    flex: 0 0 260px; width: 260px; height: 100vh;
    background: #171717; border-left: 1px solid #2a2a2a;
    color: #e8e8e8; font-size: 12px; padding: 16px 14px 24px; overflow-y: auto;
  }
  #panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 14px 0; letter-spacing: .8px; color: #ffd250; }
  .info { background: #0f0f0f; border: 1px solid #262626; border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; }
  .info .line { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; }
  .info .label { color: #666; } .info .value { color: #e0e0e0; font-variant-numeric: tabular-nums; }
  #progressOuter { height: 3px; background: #222; border-radius: 2px; overflow: hidden; margin-top: 8px; }
  #progressInner { height: 100%; width: 0%; background: linear-gradient(90deg, #2ec4b6, #ffd250); }
  .section { font-size: 10px; color: #666; letter-spacing: 1.4px; text-transform: uppercase; margin: 16px 0 8px; }
  .btnGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .btn { background: #222; border: 1px solid #333; color: #ddd; padding: 8px 6px; border-radius: 5px; font-size: 11px; cursor: pointer; text-align: center; font-family: inherit; }
  .btn:hover { background: #2d2d2d; border-color: #444; }
  .btn.active { background: #ffd250; color: #111; border-color: #ffd250; font-weight: 600; }
  .help { background: #0f0f0f; border: 1px solid #262626; border-radius: 6px; padding: 10px 12px; font-size: 10.5px; line-height: 1.9; color: #999; }
  .help .hl { color: #ffd250; }
  #subtitle {
    position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.45); color: #fff; padding: 6px 18px; border-radius: 4px;
    font-size: 15px; letter-spacing: .5px; white-space: nowrap;
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  #subtitle.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <div id="stage"><div id="subtitle"></div></div>
  </div>
  <aside id="panel">
    <h2>伴学小盒子 · 白模 <span style="font-size:10px;color:#666;font-weight:400">15s 一镜到底</span></h2>
    <div class="info">
      <div class="line"><span class="label">时间</span><span class="value" id="timeDisplay">00:00.0 / 00:15</span></div>
      <div class="line"><span class="label">阶段</span><span class="value" id="phaseDisplay">推进</span></div>
      <div id="progressOuter"><div id="progressInner"></div></div>
    </div>
    <div class="section">播放</div>
    <div class="btnGrid">
      <button class="btn" id="playBtn">▶ 播放</button>
      <button class="btn" id="replayBtn">⟲ 重播</button>
    </div>
    <div class="section">跳转</div>
    <div class="btnGrid">
      <button class="btn" data-jump="0">0s 推进</button>
      <button class="btn" data-jump="3">3s 药盒</button>
      <button class="btn" data-jump="4.5">4.5s 转1</button>
      <button class="btn" data-jump="8">8s 转2</button>
      <button class="btn" data-jump="12">12s 产品</button>
      <button class="btn" data-jump="15">15s 结束</button>
    </div>
    <div class="section">时间轴</div>
    <div class="help">
      <div class="row"><span class="hl">0–2s</span> 正对老师推进，FOV 50→32</div>
      <div class="row"><span class="hl">2–3s</span> 咳嗽，身体前倾</div>
      <div class="row"><span class="hl">3–4.5s</span> 药盒从右侧滑到老师手上</div>
      <div class="row"><span class="hl">4.5–7.5s</span> 第一次 360° 旋转（荒漠）</div>
      <div class="row"><span class="hl">7.5–8s</span> 幸福表情定格</div>
      <div class="row"><span class="hl">8–12s</span> 第二次 360° 旋转（雨林）</div>
      <div class="row"><span class="hl">12–15s</span> 硬切纯白产品特写</div>
    </div>
  </aside>
</div>

<script type="importmap">
{ "imports": { "three": "../assets/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// 基础（规范 §4：renderer/scene/camera 三个变量名保持）
// ============================================================
const DURATION = 15;
const stage = document.getElementById('stage');
const subtitle = document.getElementById('subtitle');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4e2bc);
const camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd6d2cc, 1.7));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(-9, 8, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(5, 6, 8);
scene.add(fill);

// ============================================================
// 场景：荒漠教室白模
// ============================================================
const M = {
  desert:   new THREE.MeshStandardMaterial({ color: 0xd9b87a, roughness: 1.0 }),
  crack:    new THREE.MeshStandardMaterial({ color: 0x5a3f20, roughness: 1.0 }),
  board:    new THREE.MeshStandardMaterial({ color: 0x3d4a44, roughness: 0.92 }),
  deskTop:  new THREE.MeshStandardMaterial({ color: 0xd4cdc0, roughness: 0.88 }),
  deskLeg:  new THREE.MeshStandardMaterial({ color: 0xa0a0a0, roughness: 0.55, metalness: 0.45 }),
  podium:   new THREE.MeshStandardMaterial({ color: 0xc8c0b4, roughness: 0.88 }),
  teacher:  new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.85 }),
  face:     new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 }),
  medBox:   new THREE.MeshStandardMaterial({ color: 0x2ec4b6, roughness: 0.35, metalness: 0.1 }),
  grass:    new THREE.MeshStandardMaterial({ color: 0x6bc46d, roughness: 0.7, side: THREE.DoubleSide }),
  leaf:     new THREE.MeshStandardMaterial({ color: 0x2f9e44, roughness: 0.75, side: THREE.DoubleSide }),
  trunk:    new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.9 }),
};
function box(w, h, d, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

// 荒漠地面 + 裂纹
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), M.desert);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);
[[-3.5,-3.0,-2.0,-1.5],[-2.0,-1.5,-1.2,-0.2],[3.5,-2.5,2.4,-1.8],[1.3,-1.0,0.2,-0.4]].forEach(([x1,z1,x2,z2]) => {
  const dx = x2-x1, dz = z2-z1, len = Math.hypot(dx, dz);
  const c = new THREE.Mesh(new THREE.BoxGeometry(len, 0.02, 0.07), M.crack);
  c.position.set((x1+x2)/2, 0.011, (z1+z2)/2);
  c.rotation.y = -Math.atan2(dz, dx);
  c.receiveShadow = true;
  scene.add(c);
});

// 教室：黑板 / 讲台 / 课桌 / 师生
box(5.6, 1.5, 0.08, M.board, 0, 1.85, -4.94);
box(5.8, 0.12, 0.25, M.podium, 0, 0.06, -4.75);
box(1.2, 1.1, 0.6, M.podium, 0, 0.55, -4.4);
box(2.4, 0.08, 1.0, M.deskTop, -2.2, 0.75, -3.2);
box(0.1, 0.75, 0.1, M.deskLeg, -3.3, 0.38, -3.55); box(0.1, 0.75, 0.1, M.deskLeg, -1.1, 0.38, -3.55);
box(0.1, 0.75, 0.1, M.deskLeg, -3.3, 0.38, -2.85); box(0.1, 0.75, 0.1, M.deskLeg, -1.1, 0.38, -2.85);
// 老师（站在讲台旁）
const teacher = new THREE.Group();
box(0.7, 1.5, 0.4, M.teacher, 0, 0.75, 0, teacher);
box(0.42, 0.42, 0.3, M.teacher, 0, 1.72, 0, teacher);
box(0.06, 0.06, 0.02, M.face, -0.09, 1.76, 0.16, teacher);
box(0.06, 0.06, 0.02, M.face,  0.09, 1.76, 0.16, teacher);
teacher.position.set(1.6, 0, -3.9);
scene.add(teacher);
// 药盒（产品白模）
const medBox = new THREE.Group();
box(0.34, 0.22, 0.24, M.medBox, 0, 0, 0, medBox);
box(0.36, 0.03, 0.26, M.medBox, 0, 0.12, 0, medBox);
scene.add(medBox);
// 雨林组（第二段旋转时显隐）
const jungle = new THREE.Group();
for (let i = 0; i < 7; i++) {
  const a = i / 7 * Math.PI * 2, r = 12 + (i % 3) * 2;
  const x = Math.cos(a) * r, z = Math.sin(a) * r - 4;
  box(0.3, 2.2, 0.3, M.trunk, x, 1.1, z, jungle);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.4, 8, 6), M.leaf);
  leaf.position.set(x, 2.8, z); leaf.castShadow = true;
  jungle.add(leaf);
}
jungle.visible = false;
scene.add(jungle);

// ============================================================
// 时间轴：renderAt(t) —— t 的纯函数（规范 §4.1）
// ============================================================
const PHASES = [
  [0,   '推进'], [2, '咳嗽'], [3, '药盒'], [4.5, '转场1'],
  [7.5, '幸福'], [8, '转场2'], [12, '产品特写'], [15, '结束'],
];
const SUBTITLES = { 2: '咳咳——嗓子又不舒服了', 3: '伴学小盒子，随身带着', 12: '伴学小盒子 · 掌上智能学习伴侣' };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const lerp = (a, b, k) => a + (b - a) * k;

function renderAt(t) {
  const T = Math.max(0, Math.min(DURATION, t));
  // 相机路径
  if (T < 4.5) {                                    // 0–4.5s 推进
    const k = easeInOut(T / 4.5);
    camera.fov = lerp(50, 32, Math.min(1, T / 2));
    camera.position.set(lerp(0, 0.6, k), lerp(1.7, 1.55, k), lerp(7.5, 3.2, k));
    camera.lookAt(0, 1.5, -3.6);
  } else if (T < 8) {                               // 4.5–8s 第一次 360°
    const a = (T - 4.5) / 3.5 * Math.PI * 2;
    camera.fov = 38;
    camera.position.set(Math.sin(a) * 4.6, 1.7, Math.cos(a) * 4.6);
    camera.lookAt(0, 1.4, -3.6);
  } else if (T < 12) {                              // 8–12s 第二次 360°（雨林显）
    jungle.visible = true;
    const a = (T - 8) / 4 * Math.PI * 2;
    camera.fov = 42;
    camera.position.set(Math.sin(a) * 5.2, 2.0, Math.cos(a) * 5.2);
    camera.lookAt(0, 1.6, -3.6);
  } else {                                          // 12–15s 硬切纯白产品特写
    const k = Math.min(1, (T - 12) / 0.8);
    scene.background.setRGB(lerp(0.957, 1, k), lerp(0.886, 1, k), lerp(0.737, 1, k));
    camera.fov = 22;
    camera.position.set(0.9, 0.75, 2.2);
    camera.lookAt(0, 0.15, 0);
  }
  if (T < 12) scene.background.setRGB(0.957, 0.886, 0.737);
  camera.updateProjectionMatrix();
  // 老师动作
  teacher.rotation.x = (T >= 2 && T < 3) ? -0.12 : 0;          // 咳嗽前倾
  teacher.position.y = (T >= 7.5 && T < 8) ? 0.06 : 0;          // 幸福小跳
  // 药盒滑入（3–4.5s 从右侧滑到老师手上，之后跟随）
  if (T < 3) medBox.position.set(3.2, 0.11, -3.2);
  else if (T < 4.5) {
    const k = easeInOut((T - 3) / 1.5);
    medBox.position.set(lerp(3.2, 1.6, k), 0.11, lerp(-3.2, -3.55, k));
  } else medBox.position.set(1.6, 1.02, -3.55);                 // 停在手上
  medBox.rotation.y = T * 0.6;
  renderer.render(scene, camera);
  // 字幕
  const sub = SUBTITLES[Math.max(...Object.keys(SUBTITLES).filter(Number).filter(k => T >= +k && T < +k + 1.5))];
  if (sub) { subtitle.textContent = sub; subtitle.classList.add('show'); }
  else subtitle.classList.remove('show');
}

// ============================================================
// 标准接口区（规范 §4，8 件套）
// ============================================================
let curT = 0;
window.__seek = function (t) { curT = Math.max(0, Math.min(DURATION, t)); renderAt(curT); };
window.__grab = function (t) { window.__seek(t); return renderer.domElement.toDataURL('image/jpeg', 0.92); };
window.__size = function () { return renderer.domElement.width + 'x' + renderer.domElement.height; };
window.__glOk = (function () {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }
  catch (e) { return false; }
})();
window.__duration = DURATION;
window.__getTime = function () { return curT; };
window.__playing = false;

let rafId = 0, lastMs = 0;
function loop(ms) {
  if (!window.__playing) return;
  const dt = lastMs ? Math.min((ms - lastMs) / 1000, 0.1) : 0;
  lastMs = ms;
  curT += dt;
  if (curT >= DURATION) { curT = DURATION; renderAt(curT); window.__playing = false; updateBtn(); return; }
  renderAt(curT);
  rafId = requestAnimationFrame(loop);
}
window.__play = function () {
  if (window.__playing) return;
  if (curT >= DURATION) curT = 0;
  window.__playing = true; lastMs = 0; updateBtn();
  rafId = requestAnimationFrame(loop);
};
window.__pause = function () { window.__playing = false; cancelAnimationFrame(rafId); updateBtn(); };

// ============================================================
// 嵌入模式（规范 §2，工作台 iframe 加载时）——不要改
// ============================================================
if (window.__EMBED__ === true) {
  document.getElementById('panel')?.remove();
  Object.assign(document.getElementById('stage').style, {
    width: '100%', height: '100%', maxWidth: 'none', maxHeight: 'none', aspectRatio: 'auto'
  });
  document.body.style.overflow = 'hidden';
  const resize = () => renderer.setSize(stage.clientWidth, stage.clientHeight);
  window.addEventListener('resize', resize); resize();
}

// ============================================================
// 独立运行面板（嵌入时不存在）
// ============================================================
const playBtn = document.getElementById('playBtn');
const replayBtn = document.getElementById('replayBtn');
const timeDisplay = document.getElementById('timeDisplay');
const phaseDisplay = document.getElementById('phaseDisplay');
const progressInner = document.getElementById('progressInner');
function fmt(t) { return String(Math.floor(t / 60)).padStart(2, '0') + ':' + (t % 60).toFixed(1).padStart(4, '0'); }
function phaseOf(t) { let p = PHASES[0][1]; for (const [tt, name] of PHASES) if (t >= tt) p = name; return p; }
function updateBtn() { if (playBtn) playBtn.textContent = window.__playing ? '⏸ 暂停' : '▶ 播放'; }
playBtn?.addEventListener('click', () => window.__playing ? window.__pause() : window.__play());
replayBtn?.addEventListener('click', () => { window.__pause(); renderAt(0); window.__play(); });
document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => {
  window.__pause(); renderAt(parseFloat(b.dataset.jump));
}));
// 面板刷新定时器（独立运行时）
setInterval(() => {
  if (window.__EMBED__ || !timeDisplay) return;
  timeDisplay.textContent = fmt(curT) + ' / 00:15';
  phaseDisplay.textContent = phaseOf(curT);
  progressInner.style.width = (curT / DURATION * 100) + '%';
}, 100);

renderAt(0);
window.__ready = true;   // 规范 §4：最后置就绪标志
</script>

<script type="application/json" id="whitebox-manifest">
{
  "spec": "whitebox-html/1.0",
  "title": "伴学小盒子 · 荒漠教室白模",
  "author": "白膜工作台示例",
  "duration": 15,
  "location": { "name": "巴东·神农中小学", "lat": 31.04, "lng": 110.34 },
  "shots": [
    { "t": 0,   "label": "推进" },
    { "t": 2,   "label": "咳嗽" },
    { "t": 3,   "label": "药盒" },
    { "t": 4.5, "label": "转场1" },
    { "t": 7.5, "label": "幸福" },
    { "t": 8,   "label": "转场2" },
    { "t": 12,  "label": "产品特写" }
  ],
  "notes": "0–2s 正对老师推进 FOV50→32；3–4.5s 药盒滑入老师手；4.5–8s 第一次360°荒漠；8–12s 第二次360°雨林显；12–15s 硬切纯白产品特写。"
}
</script>
</body>
</html>
