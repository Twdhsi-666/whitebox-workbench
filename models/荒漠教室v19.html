<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>荒漠教室白模 · 一镜到底 v19</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: #0a0a0a;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app { display: flex; width: 100vw; height: 100vh; }
  #stageWrap {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; min-width: 0; min-height: 0;
    background: #0a0a0a;
  }
  #stage {
    aspect-ratio: 16 / 9;
    width: 100%; max-width: 100%; max-height: 100%;
    background: #000; position: relative; overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.9);
  }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; }

  #panel {
    flex: 0 0 270px; width: 270px; height: 100vh;
    background: #171717; border-left: 1px solid #2a2a2a;
    color: #e8e8e8; font-size: 12px;
    padding: 16px 14px 24px; overflow-y: auto;
    transition: margin-right 0.25s ease;
  }
  #panel.hidden { margin-right: -270px; }
  #panel h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 14px 0;
    letter-spacing: 0.8px; color: #ffd250;
    display: flex; justify-content: space-between; align-items: center;
  }
  #panel h2 .hint { font-size: 10px; color: #666; font-weight: 400; }

  .info {
    background: #0f0f0f; border: 1px solid #262626;
    border-radius: 6px; padding: 10px 12px; margin-bottom: 14px;
  }
  .info .line {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3px 0; font-size: 11px;
  }
  .info .label { color: #666; }
  .info .value { color: #e0e0e0; font-variant-numeric: tabular-nums; }
  #progressOuter { height: 3px; background: #222; border-radius: 2px; overflow: hidden; margin-top: 8px; }
  #progressInner { height: 100%; width: 0%; background: linear-gradient(90deg, #2ec4b6, #ffd250); transition: width 0.05s linear; }

  .section {
    font-size: 10px; color: #666; letter-spacing: 1.4px;
    text-transform: uppercase; margin: 16px 0 8px; padding-left: 2px;
  }
  .btnGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .btn {
    background: #222; border: 1px solid #333; color: #ddd;
    padding: 8px 6px; border-radius: 5px; font-size: 11px;
    cursor: pointer; transition: all 0.15s; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: inherit;
  }
  .btn:hover { background: #2d2d2d; border-color: #444; }
  .btn.active { background: #ffd250; color: #111; border-color: #ffd250; font-weight: 600; }
  .btn.primary { background: rgba(80,160,255,0.25); border-color: rgba(80,160,255,0.6); color: #9ecbff; }
  .btn.primary:hover { background: rgba(80,160,255,0.4); }

  .help {
    background: #0f0f0f; border: 1px solid #262626;
    border-radius: 6px; padding: 10px 12px;
    font-size: 10.5px; line-height: 1.9; color: #999;
  }
  .help .row { margin-bottom: 3px; }
  .help .row:last-child { margin-bottom: 0; }
  .help .hl { color: #ffd250; }

  .tip { font-size: 10px; color: #555; text-align: center; margin-top: 14px; line-height: 1.6; }

  #subtitle {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    color: #fff;
    padding: 6px 18px;
    border-radius: 4px;
    font-size: 15px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  #subtitle.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <div id="stage">
      <div id="subtitle"></div>
    </div>
  </div>

  <div id="panel">
    <h2>一镜到底 · 12+3 <span class="hint">按 H 隐藏</span></h2>

    <div class="info">
      <div class="line"><span class="label">时间</span><span class="value" id="timeDisplay">00:00.0 / 00:15</span></div>
      <div class="line"><span class="label">阶段</span><span class="value" id="phaseDisplay">推进</span></div>
      <div id="progressOuter"><div id="progressInner"></div></div>
    </div>

    <div class="section">播放</div>
    <div class="btnGrid">
      <button class="btn primary" id="playBtn">▶ 播放</button>
      <button class="btn" id="replayBtn">⟲ 重播</button>
    </div>

    <div class="section">跳转</div>
    <div class="btnGrid">
      <button class="btn" data-jump="0">0s 推进</button>
      <button class="btn" data-jump="2">2s 咳嗽</button>
      <button class="btn" data-jump="3">3s 药盒（固定）</button>
      <button class="btn" data-jump="4.5">4.5s 转1</button>
      <button class="btn" data-jump="7.5">7.5s 笑</button>
      <button class="btn" data-jump="8">8s 转2</button>
      <button class="btn" data-jump="12">12s 产品</button>
    </div>

    <div class="section">时间轴</div>
    <div class="help">
      <div class="row"><span class="hl">0–2s</span> 正对老师脸推进，FOV 50→32</div>
      <div class="row"><span class="hl">2–3s</span> 咳嗽，身体前倾</div>
      <div class="row"><span class="hl">3–4.5s</span> 镜头固定对着老师，药盒从右侧滑到老师手上</div>
      <div class="row"><span class="hl">4.5–7.5s</span> 第一次旋转360°，看荒漠，转回正面看到老师吃药</div>
      <div class="row"><span class="hl">7.5–8s</span> 幸福表情，背景黑板</div>
      <div class="row"><span class="hl">8–12s</span> 第二次旋转360°，看雨林</div>
      <div class="row"><span class="hl">12–15s</span> 硬切纯白产品特写</div>
    </div>

    <div class="tip">录屏时只框选左侧画布区域<br>按 H 键可隐藏面板</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// DOM
// ============================================================
const stage = document.getElementById('stage');
const subtitle = document.getElementById('subtitle');
const progressInner = document.getElementById('progressInner');
const timeDisplay = document.getElementById('timeDisplay');
const phaseDisplay = document.getElementById('phaseDisplay');
const panel = document.getElementById('panel');
const playBtn = document.getElementById('playBtn');
const replayBtn = document.getElementById('replayBtn');

// ============================================================
// 场景
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4e2bc);

const camera = new THREE.PerspectiveCamera(50, 16/9, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd6d2cc, 1.7));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(-9, 8, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(5, 6, 8);
scene.add(fill);

// ============================================================
// 材质
// ============================================================
const M = {
  desert:      new THREE.MeshStandardMaterial({ color: 0xd9b87a, roughness: 1.0 }),
  crack:       new THREE.MeshStandardMaterial({ color: 0x5a3f20, roughness: 1.0 }),
  board:       new THREE.MeshStandardMaterial({ color: 0x3d4a44, roughness: 0.92, transparent: true, opacity: 1 }),
  boardTrim:   new THREE.MeshStandardMaterial({ color: 0xb2a99c, roughness: 0.75, transparent: true, opacity: 1 }),
  deskTop:     new THREE.MeshStandardMaterial({ color: 0xd4cdc0, roughness: 0.88 }),
  deskLeg:     new THREE.MeshStandardMaterial({ color: 0xa0a0a0, roughness: 0.55, metalness: 0.45 }),
  podium:      new THREE.MeshStandardMaterial({ color: 0xc8c0b4, roughness: 0.88 }),
  teacher:     new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.85 }),
  student:     new THREE.MeshStandardMaterial({ color: 0xb2b2b2, roughness: 0.85 }),
  chalkBox:    new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.8 }),
  medBox:      new THREE.MeshStandardMaterial({ color: 0x2ec4b6, roughness: 0.35, metalness: 0.1 }),
  grass:       new THREE.MeshStandardMaterial({ color: 0x6bc46d, roughness: 0.7, side: THREE.DoubleSide }),
  treeLeaf:    new THREE.MeshStandardMaterial({ color: 0x2f9e44, roughness: 0.75, side: THREE.DoubleSide }),
  treeLeafAlt: new THREE.MeshStandardMaterial({ color: 0x4ea862, roughness: 0.75, side: THREE.DoubleSide }),
  tumbleweed:  new THREE.MeshStandardMaterial({ color: 0xb8a070, roughness: 1.0 }),
  faceMark:    new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 }),
  sandDune:    new THREE.MeshStandardMaterial({ color: 0xc9a86a, roughness: 1.0 }),
  whiteFloor:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0 }),
};

function addBox(w, h, d, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ============================================================
// 教室组
// ============================================================
const classroomGroup = new THREE.Group();
scene.add(classroomGroup);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), M.desert);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
classroomGroup.add(floor);

const crackGroup = new THREE.Group();
classroomGroup.add(crackGroup);
[
  [-3.5, -3.0, -2.0, -1.5, 0.07],[-2.0, -1.5, -1.2, -0.2, 0.06],
  [-1.2, -0.2, -0.5,  0.8, 0.065],[-0.5,  0.8,  0.6,  1.5, 0.06],
  [ 0.6,  1.5,  1.8,  2.0, 0.07],[ 1.8,  2.0,  3.2,  2.6, 0.065],
  [ 3.5, -2.5,  2.4, -1.8, 0.06],[ 2.4, -1.8,  1.3, -1.0, 0.07],
  [ 1.3, -1.0,  0.2, -0.4, 0.06],[ 0.2, -0.4, -0.8,  0.2, 0.065],
  [-0.8,  0.2, -1.9,  0.6, 0.06],
].forEach(([x1, z1, x2, z2, w]) => {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const angle = Math.atan2(dz, dx);
  const crack = new THREE.Mesh(new THREE.BoxGeometry(len, 0.02, w), M.crack);
  crack.position.set((x1 + x2) / 2, 0.011, (z1 + z2) / 2);
  crack.rotation.y = -angle;
  crack.receiveShadow = true;
  crackGroup.add(crack);
});

const boardGroup = new THREE.Group();
boardGroup.position.set(0, 0, -4.94);
classroomGroup.add(boardGroup);
addBox(5.6, 1.5, 0.08, M.board, 0, 1.85, 0, boardGroup);
addBox(5.8, 0.08, 0.18, M.boardTrim, 0, 1.06, 0.07, boardGroup);

addBox(1.2, 0.75, 0.5, M.podium, -0.9, 0.375, -4.2, classroomGroup);
addBox(0.26, 0.09, 0.14, M.chalkBox, -0.7, 0.79, -4.1, classroomGroup);

// ============================================================
// 人物
// ============================================================
function makeFaceMark(group, headY, sphereR) {
  const mark = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.018, 0.008), M.faceMark);
  mark.position.set(0, headY, sphereR + 0.001);
  group.add(mark);
}
function makeStandingPerson(material) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.35, 0.20), material);
  body.position.y = 0.675;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const headY = 1.485; const sphereR = 0.135;
  const head = new THREE.Mesh(new THREE.SphereGeometry(sphereR, 20, 16), material);
  head.position.y = headY;
  head.castShadow = true; head.receiveShadow = true;
  g.add(head);
  makeFaceMark(g, headY, sphereR);
  return g;
}
function makeSittingPerson(material) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.82, 0.20), material);
  body.position.y = 0.45 + 0.41;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const headY = 0.45 + 0.82 + 0.13; const sphereR = 0.13;
  const head = new THREE.Mesh(new THREE.SphereGeometry(sphereR, 20, 16), material);
  head.position.y = headY;
  head.castShadow = true; head.receiveShadow = true;
  g.add(head);
  makeFaceMark(g, headY, sphereR);
  return g;
}

const teacher = makeStandingPerson(M.teacher);
teacher.position.set(-0.9, 0, -3.8);
teacher.rotation.y = 0;
classroomGroup.add(teacher);
const teacherHead = teacher.children[1];

function makeDesk(x, z, rotY = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  const W = 1.0, D = 0.5, H = 0.75;
  addBox(W, 0.04, D, M.deskTop, 0, H, 0, g);
  const legGeo = new THREE.BoxGeometry(0.04, H, 0.04);
  [[-W/2+0.06, -D/2+0.06], [W/2-0.06, -D/2+0.06],
   [-W/2+0.06,  D/2-0.06], [W/2-0.06,  D/2-0.06]].forEach(([ox, oz]) => {
    const leg = new THREE.Mesh(legGeo, M.deskLeg);
    leg.position.set(ox, H/2, oz);
    leg.castShadow = true;
    g.add(leg);
  });
  classroomGroup.add(g);
  return g;
}
function makeChair(x, z, rotY = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  addBox(0.42, 0.04, 0.4, M.deskTop, 0, 0.45, 0, g);
  const legGeo = new THREE.BoxGeometry(0.035, 0.45, 0.035);
  [[-0.17, -0.16], [0.17, -0.16], [-0.17, 0.16], [0.17, 0.16]].forEach(([ox, oz]) => {
    const leg = new THREE.Mesh(legGeo, M.deskLeg);
    leg.position.set(ox, 0.225, oz);
    leg.castShadow = true;
    g.add(leg);
  });
  addBox(0.42, 0.38, 0.035, M.deskTop, 0, 0.66, 0.18, g);
  classroomGroup.add(g);
  return g;
}

const COLS = [-3.3, -1.1, 1.1, 3.3];
const ROWS_Z = [-2.3, -0.8, 0.7, 2.2];
const studentRefs = [];
ROWS_Z.forEach(z => {
  COLS.forEach(x => {
    makeDesk(x, z);
    makeChair(x, z + 0.62);
    const s = makeSittingPerson(M.student);
    s.position.set(x, 0, z + 0.62);
    s.rotation.y = Math.PI;
    classroomGroup.add(s);
    studentRefs.push(s);
  });
});

// ============================================================
// 药盒
// ============================================================
const medBox = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 0.14), M.medBox);
medBox.castShadow = true;
medBox.position.set(1.5, 1.05, -3.9);
medBox.visible = false;
classroomGroup.add(medBox);

// ============================================================
// 风滚草
// ============================================================
const tumbleweedGeo = new THREE.SphereGeometry(0.55, 14, 12);
const twPos = tumbleweedGeo.attributes.position;
for (let i = 0; i < twPos.count; i++) {
  const x = twPos.getX(i), y = twPos.getY(i), z = twPos.getZ(i);
  const noise = (Math.random() - 0.5) * 0.30;
  twPos.setXYZ(i, x * (1 + noise), y * (1 + noise), z * (1 + noise));
}
tumbleweedGeo.computeVertexNormals();
const tumbleweed = new THREE.Mesh(tumbleweedGeo, M.tumbleweed);
tumbleweed.castShadow = true;
tumbleweed.position.set(8, 0.55, 5);
classroomGroup.add(tumbleweed);

// 沙丘
const duneGroup = new THREE.Group();
classroomGroup.add(duneGroup);
[
  [-15, -0.5, -12, 8, 4, 6], [15, -0.5, -12, 8, 4, 6],
  [-15, -0.5,  12, 8, 4, 6], [15, -0.5,  12, 8, 4, 6],
  [0, -0.5, -20, 20, 5, 10], [0, -0.5, 20, 20, 5, 10],
].forEach(([x, y, z, w, h, d]) => {
  const dune = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M.sandDune);
  dune.position.set(x, y, z);
  dune.receiveShadow = true;
  duneGroup.add(dune);
});

// 雨林
const rainforestGroup = new THREE.Group();
classroomGroup.add(rainforestGroup);
const rainforestParts = [];
function addRainLeaf(x, y, z, w, h, rotY, mat) {
  const leaf = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  leaf.position.set(x, y, z);
  leaf.rotation.y = rotY;
  leaf.castShadow = true;
  leaf.userData.baseY = y;
  leaf.scale.set(0.01, 0.01, 0.01);
  rainforestGroup.add(leaf);
  rainforestParts.push(leaf);
}
for (let i = 0; i < 20; i++) {
  const x = -6 + i * 0.6;
  addRainLeaf(x, 0.9 + Math.random() * 1.2, -5.5 - Math.random() * 1.5,
    0.7 + Math.random() * 0.4, 1.2 + Math.random() * 0.8,
    Math.random() * 0.5 - 0.25, i % 3 === 0 ? M.treeLeafAlt : M.treeLeaf);
}
for (let i = 0; i < 12; i++) {
  addRainLeaf(-6 - Math.random() * 2, 0.8 + Math.random(), -2 + Math.random() * 6,
    0.6 + Math.random() * 0.5, 1 + Math.random() * 0.8, Math.random() * Math.PI, M.treeLeaf);
  addRainLeaf(6 + Math.random() * 2, 0.8 + Math.random(), -2 + Math.random() * 6,
    0.6 + Math.random() * 0.5, 1 + Math.random() * 0.8, Math.random() * Math.PI, M.treeLeafAlt);
}
studentRefs.forEach((s, i) => {
  if (i % 2 === 0) addRainLeaf(s.position.x + 0.4, 0.5, s.position.z, 0.4, 0.5, Math.random() * Math.PI, M.grass);
  if (i % 3 === 0) addRainLeaf(s.position.x, 0.15, s.position.z + 0.3, 0.5, 0.4, Math.random() * Math.PI, M.grass);
});
for (let i = 0; i < 30; i++) {
  const x = -4 + Math.random() * 8, z = -4 + Math.random() * 8;
  addRainLeaf(x, 0.1, z, 0.3 + Math.random() * 0.3, 0.2 + Math.random() * 0.2, Math.random() * Math.PI, M.grass);
}

// ============================================================
// 产品特写
// ============================================================
const productGroup = new THREE.Group();
productGroup.visible = false;
scene.add(productGroup);

const bigMedBox = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.14), M.medBox);
bigMedBox.castShadow = true; bigMedBox.receiveShadow = true;
bigMedBox.position.set(0, 0.15, 0);
productGroup.add(bigMedBox);

const productFloor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), M.whiteFloor);
productFloor.rotation.x = -Math.PI / 2;
productFloor.receiveShadow = true;
productGroup.add(productFloor);

for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const r = 0.55 + Math.random() * 0.15;
  const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.10), M.grass);
  leaf.position.set(Math.cos(a) * r, 0.05, Math.sin(a) * r);
  leaf.rotation.x = -Math.PI / 2;
  leaf.rotation.z = Math.random() * Math.PI;
  leaf.castShadow = true;
  productGroup.add(leaf);
}

// ============================================================
// 时间轴
// ============================================================
const CENTER = { x: -0.9, y: 1.4, z: -3.8 };
const ROT_RADIUS = 1.8;
const ROT_HEIGHT = 1.5;

function smoothstep(x) { return x * x * (3 - 2 * x); }

// 关键时间点
const T_ADV_END   = 2.0;   // 推进结束
const T_COUGH_END = 3.0;   // 咳嗽结束
const T_BOX_END   = 4.5;   // 药盒递到手上结束（镜头固定，不旋转）
const T_ROT1_END  = 7.5;   // 第一次旋转结束
const T_SMILE_END = 8.0;   // 幸福表情结束
const T_ROT2_END  = 12.0;  // 第二次旋转结束
const T_ALL       = 15.0;

// 推进起点/终点
const ADV_START = new THREE.Vector3(0, 1.6, 2.0);
const ADV_END   = new THREE.Vector3(-0.9, 1.5, -2.5);

// 旋转起始角度
const ROT_START_ANGLE = Math.atan2(ADV_END.x - CENTER.x, ADV_END.z - CENTER.z);

function rotPos(angle) {
  return new THREE.Vector3(
    CENTER.x + Math.sin(angle) * ROT_RADIUS,
    ROT_HEIGHT,
    CENTER.z + Math.cos(angle) * ROT_RADIUS
  );
}

function updateCamera(tSec) {
  if (tSec < T_ADV_END) {
    // 0–2s：正对老师脸推进
    const e = smoothstep(tSec / T_ADV_END);
    camera.position.copy(ADV_START).lerp(ADV_END, e);
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
    camera.fov = 50 - 18 * e;
    phaseDisplay.textContent = '推进';
  } else if (tSec < T_COUGH_END) {
    // 2–3s：咳嗽，机位固定
    camera.position.copy(ADV_END);
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
    camera.fov = 32;
    const t = tSec * 12;
    camera.position.x += Math.sin(t) * 0.008;
    camera.position.y += Math.cos(t * 1.3) * 0.006;
    phaseDisplay.textContent = '咳嗽';
  } else if (tSec < T_BOX_END) {
    // 3–4.5s：镜头完全固定对着老师，不旋转，药盒滑到手上
    camera.position.copy(ADV_END);
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
    camera.fov = 32;
    phaseDisplay.textContent = '递药盒（固定）';
  } else if (tSec < T_ROT1_END) {
    // 4.5–7.5s：第一次旋转 360°，看荒漠，转回正面看到吃药
    const e = smoothstep((tSec - T_BOX_END) / (T_ROT1_END - T_BOX_END));
    const angle = ROT_START_ANGLE - e * Math.PI * 2;
    camera.position.copy(rotPos(angle));
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
    camera.fov = 50;
    phaseDisplay.textContent = '旋转1（荒漠 → 吃药）';
  } else if (tSec < T_SMILE_END) {
    // 7.5–8s：幸福表情，机位固定对着老师正面
    camera.position.copy(ADV_END);
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
    camera.fov = 35;
    phaseDisplay.textContent = '幸福表情';
  } else if (tSec < T_ROT2_END) {
    // 8–12s：第二次旋转 360°，看雨林
    const e = smoothstep((tSec - T_SMILE_END) / (T_ROT2_END - T_SMILE_END));
    const angle = ROT_START_ANGLE - e * Math.PI * 2;
    camera.position.copy(rotPos(angle));
    camera.lookAt(CENTER.x, CENTER.y, CENTER.z);
    camera.fov = 50 + e * 15;
    phaseDisplay.textContent = '旋转2（雨林）';
  } else {
    // 12–15s：纯白产品特写
    const e = smoothstep((tSec - T_ROT2_END) / (T_ALL - T_ROT2_END));
    const angle = -Math.PI / 10 + e * Math.PI / 5;
    const radius = 1.15 - e * 0.12;
    camera.position.set(
      Math.sin(angle) * radius,
      0.32 + e * 0.06,
      Math.cos(angle) * radius
    );
    camera.lookAt(0, 0.18, 0);
    camera.fov = 45;
    phaseDisplay.textContent = '产品特写';
  }
  camera.updateProjectionMatrix();
}

// ============================================================
// 老师动作
// ============================================================
function updateTeacher(tSec) {
  let headY = 1.485;
  let headZ = 0;
  let bodyTilt = 0;

  // 0–2s 讲课
  if (tSec < 2) {
    headY = 1.485 + Math.sin(tSec * 3) * 0.010;
    headZ = Math.sin(tSec * 2.5) * 0.008;
  }
  // 2–3s 咳嗽
  else if (tSec < 3) {
    const p = (tSec - 2) / 1.0;
    const cough = Math.sin(p * Math.PI * 4) * 0.5 + 0.5;
    headY = 1.485 - cough * 0.06;
    headZ = 0.035 * cough;
    bodyTilt = cough * 0.08;
  }
  // 3–4.5s 看到药盒，微微一顿
  else if (tSec < 4.5) {
    headY = 1.44;
    headZ = 0.02;
  }
  // 4.5–6.5s 第一次旋转期间，老师低头拿起药盒吃
  else if (tSec >= 4.5 && tSec < 6.5) {
    const p = (tSec - 4.5) / 2.0;
    headY = 1.44 - Math.sin(p * Math.PI) * 0.09;
    headZ = 0.04 * Math.sin(p * Math.PI);
  }
  // 6.5–7.5s 抬头，准备转回正面
  else if (tSec >= 6.5 && tSec < 7.5) {
    const p = (tSec - 6.5) / 1.0;
    headY = 1.485 - (1 - p) * 0.03;
  }
  // 7.5–8s 幸福表情：轻轻抬头
  else if (tSec >= 7.5 && tSec < 8) {
    const p = (tSec - 7.5) / 0.5;
    headY = 1.485 + Math.sin(p * Math.PI) * 0.02;
  }

  teacherHead.position.y = headY;
  teacherHead.position.z = headZ;
  teacher.rotation.x = bodyTilt;
}

// ============================================================
// 黑板：两次旋转各移开一次
// ============================================================
function updateBoard(tSec) {
  // 0–4.5s：保持
  if (tSec < T_BOX_END) {
    boardGroup.position.x = 0;
    M.board.opacity = 1;
    M.boardTrim.opacity = 1;
    boardGroup.visible = true;
    return;
  }
  // 4.5–7.5s：第一次旋转，移开
  if (tSec >= T_BOX_END && tSec < T_ROT1_END) {
    const p = (tSec - T_BOX_END) / (T_ROT1_END - T_BOX_END);
    const mp = Math.min(Math.max((p - 0.1) / 0.4, 0), 1);
    const e = smoothstep(mp);
    boardGroup.position.x = e * 12;
    M.board.opacity = 1 - e;
    M.boardTrim.opacity = 1 - e;
    boardGroup.visible = M.board.opacity > 0.01;
    return;
  }
  // 7.5–8s：幸福表情，黑板快速移回
  if (tSec >= T_ROT1_END && tSec < 8.0) {
    const p = (tSec - T_ROT1_END) / 0.5;
    const e = smoothstep(p);
    boardGroup.position.x = (1 - e) * 12;
    M.board.opacity = e;
    M.boardTrim.opacity = e;
    boardGroup.visible = M.board.opacity > 0.01;
    return;
  }
  // 8–12s：第二次旋转，再次移开
  if (tSec >= T_SMILE_END && tSec < T_ROT2_END) {
    const p = (tSec - T_SMILE_END) / (T_ROT2_END - T_SMILE_END);
    const mp = Math.min(Math.max((p - 0.1) / 0.4, 0), 1);
    const e = smoothstep(mp);
    boardGroup.position.x = e * 12;
    M.board.opacity = 1 - e;
    M.boardTrim.opacity = 1 - e;
    boardGroup.visible = M.board.opacity > 0.01;
    return;
  }
  // 12s 后隐藏
  boardGroup.visible = false;
}

// ============================================================
// 药盒
// ============================================================
function updateMedBox(tSec) {
  if (tSec < 3.0) {
    medBox.visible = false;
    medBox.position.set(1.5, 1.05, -3.9);
    medBox.scale.set(1, 1, 1);
  } else if (tSec < 4.5) {
    // 3–4.5s：从右侧滑到老师手上，镜头固定
    const e = smoothstep((tSec - 3.0) / 1.5);
    medBox.visible = true;
    medBox.position.set(1.5 + (0.2 - 1.5) * e, 1.05, -3.9);
    medBox.scale.set(1, 1, 1);
  } else if (tSec < 6.5) {
    // 4.5–6.5s：老师拿起吃，药盒保持
    medBox.visible = true;
    medBox.position.set(0.2, 1.05, -3.9);
    medBox.scale.set(1, 1, 1);
  } else {
    // 6.5s 后被吃掉，消失
    medBox.visible = false;
  }
}

// ============================================================
// 风滚草
// ============================================================
function updateTumbleweed(tSec) {
  if (tSec < 4.5 || tSec > 12) { tumbleweed.visible = false; return; }
  tumbleweed.visible = true;
  const p = (tSec - 4.5) / 7.5;
  tumbleweed.position.x = 8 - p * 20;
  tumbleweed.position.z = 5 + Math.sin(p * Math.PI) * 2;
  tumbleweed.rotation.z = -tSec * 5;
}

// ============================================================
// 雨林
// ============================================================
function updateRainforest(tSec) {
  if (tSec < 8.0) {
    rainforestParts.forEach(p => p.scale.set(0.01, 0.01, 0.01));
    return;
  }
  const p = Math.min(Math.max((tSec - 8.0) / 4.0, 0), 1);
  rainforestParts.forEach((part, i) => {
    const delay = (i % 10) * 0.04;
    const local = Math.max(0, Math.min(1, (p - delay) / (1 - delay + 0.01)));
    const s = 0.01 + 0.99 * smoothstep(local);
    part.scale.set(s, s, s);
    part.position.y = part.userData.baseY * s + 0.001;
  });
}

// ============================================================
// 地板颜色
// ============================================================
const COLOR_DRY = new THREE.Color(0xd9b87a);
const COLOR_MID = new THREE.Color(0xa8b564);
const COLOR_WET = new THREE.Color(0x5a8c4a);

function updateFloorColor(tSec) {
  let c;
  if (tSec < 8.0) c = COLOR_DRY.clone();
  else if (tSec < 10.0) {
    const e = smoothstep((tSec - 8.0) / 2.0);
    c = COLOR_DRY.clone().lerp(COLOR_MID, e);
  } else if (tSec < 12.0) {
    const e = smoothstep((tSec - 10.0) / 2.0);
    c = COLOR_MID.clone().lerp(COLOR_WET, e);
  } else c = COLOR_WET.clone();
  floor.material.color.copy(c);
}

// ============================================================
// 场景切换
// ============================================================
function updateSceneVisibility(tSec) {
  const isProduct = tSec >= 12;
  classroomGroup.visible = !isProduct;
  productGroup.visible = isProduct;
  scene.background.set(isProduct ? 0xffffff : 0xf4e2bc);
}

// ============================================================
// 字幕
// ============================================================
function updateSubtitle(tSec) {
  let text = '';
  if (tSec >= 0.3 && tSec < 2.0) {
    text = '我们来看这个公式……当 x 趋近于零的时候，';
  } else if (tSec >= 2.0 && tSec < 3.0) {
    text = '咳……等一下。';
  } else if (tSec >= 7.5 && tSec < 8.0) {
    text = '（一声舒爽的呼气）';
  }
  if (text) {
    subtitle.textContent = text;
    subtitle.classList.add('show');
  } else {
    subtitle.classList.remove('show');
  }
}

// ============================================================
// 面板
// ============================================================
function updatePanel(tSec) {
  progressInner.style.width = ((tSec / 15) * 100).toFixed(2) + '%';
  const s = Math.floor(tSec);
  const ds = Math.floor((tSec - s) * 10);
  timeDisplay.textContent = `00:${String(s).padStart(2,'0')}.${ds} / 00:15`;
}

// ============================================================
// 播放控制
// ============================================================
let startTime = performance.now();
let isPlaying = true;
let frozenTime = 0;
let lastFrameNow = performance.now();

function play() {
  isPlaying = true;
  startTime = performance.now() - frozenTime * 1000;
  playBtn.textContent = '⏸ 暂停';
  playBtn.classList.add('active');
}
function pause() {
  isPlaying = false;
  playBtn.textContent = '▶ 播放';
  playBtn.classList.remove('active');
}
function replay() {
  frozenTime = 0;
  startTime = performance.now();
  isPlaying = true;
  playBtn.textContent = '⏸ 暂停';
  playBtn.classList.add('active');
}

playBtn.addEventListener('click', () => { if (isPlaying) pause(); else play(); });
replayBtn.addEventListener('click', replay);

document.querySelectorAll('.btn[data-jump]').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = parseFloat(btn.dataset.jump);
    frozenTime = t;
    startTime = performance.now() - t * 1000;
    isPlaying = true;
    playBtn.textContent = '⏸ 暂停';
    playBtn.classList.add('active');
  });
});

// ============================================================
// 循环
// ============================================================
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastFrameNow) / 1000, 0.1);
  lastFrameNow = now;

  let tSec;
  if (isPlaying) {
    tSec = Math.min((now - startTime) / 1000, 15);
    if (tSec >= 15) {
      isPlaying = false;
      playBtn.textContent = '▶ 播放';
      playBtn.classList.remove('active');
    }
    frozenTime = tSec;
  } else {
    tSec = frozenTime;
  }

  updateCamera(tSec);
  updateBoard(tSec);
  updateMedBox(tSec);
  updateTeacher(tSec);
  updateTumbleweed(tSec);
  updateRainforest(tSec);
  updateFloorColor(tSec);
  updateSceneVisibility(tSec);
  updateSubtitle(tSec);
  updatePanel(tSec);

  renderer.render(scene, camera);
}

// ============================================================
// 自适应
// ============================================================
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(stage);
resize();

window.addEventListener('keydown', e => {
  if (e.code === 'KeyH' && !e.ctrlKey && !e.metaKey) {
    panel.classList.toggle('hidden');
    setTimeout(resize, 260);
  }
});

playBtn.classList.add('active');
playBtn.textContent = '⏸ 暂停';
requestAnimationFrame(animate);
</script>
